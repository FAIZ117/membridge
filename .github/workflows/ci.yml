name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} · Node ${{ matrix.node }}
    # 20 min: a hung suite (Windows worker-teardown paths are the known
    # suspect) fails the job instead of burning the 6-hour default.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # windows-2022: node-gyp's VS discovery overflows its stdio buffer on
        # the windows-2025 image (node-gyp#3147 class) — pin until that is fixed
        os: [ubuntu-latest, macos-latest, windows-2022]
        node: [22, 24, 26]
    runs-on: ${{ matrix.os }}
    # Linux is the verified platform and gates the run. macOS/Windows are
    # mid-integration: their failures stay VISIBLE here but do not block
    # (docs/compat.md "Known issues on non-Linux" is the punch-list; the
    # release workflow does NOT inherit this — it hard-fails).
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install (builds the addon via node-gyp-build)
        run: npm install
      - name: Run the full suite
        run: npm test
        # Platform-specific tests skip themselves with stated reasons:
        #   E_NO_SPACE tmpfs — needs SHM_BRIDGE_TEST_TMPFS (only the ubuntu job
        #     mounts one, below)
        #   capacity/list   — Linux-only; other OSes assert E_UNSUPPORTED
        #   /dev/shm byte-crafting — POSIX-only crash-state tests

  tmpfs:
    # E_NO_SPACE reserve test (§13): a dedicated small tmpfs, so the create
    # fails at posix_fallocate time instead of OOMing the runner.
    name: ubuntu · small-tmpfs E_NO_SPACE
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Mount a 64 MiB tmpfs
        run: |
          sudo mkdir -p /mnt/shm-bridge-tmpfs
          sudo mount -t tmpfs -o size=64m tmpfs /mnt/shm-bridge-tmpfs
          # bind it as the segment source: shm-bridge uses /dev/shm, so run the
          # test in a mount namespace where /dev/shm IS the small tmpfs
          echo "SHM_BRIDGE_TEST_TMPFS=/mnt/shm-bridge-tmpfs" >> "$GITHUB_ENV"
      - run: npm install
      - name: Run the suite inside the small-tmpfs namespace
        # PATH is preserved explicitly: sudo's secure_path resolves to the
        # system Node (22), whose ABI differs from the setup-node Node (24)
        # the addon was built against — node-gyp-build then reports the addon
        # as unavailable inside the namespace.
        run: >
          sudo env PATH="$PATH" unshare --mount
          bash -c 'mount --bind /mnt/shm-bridge-tmpfs /dev/shm &&
                   chmod 1777 /dev/shm &&
                   cd "$GITHUB_WORKSPACE" &&
                   echo "node: $(node -v), addon loads: $(node -p "require(process.argv[1]).isNative()" "$PWD/dist/index.js")" &&
                   SHM_BRIDGE_TEST_TMPFS=/mnt/shm-bridge-tmpfs npm test'

  sanitizers:
    # ASAN/UBSan (§12): LD_PRELOAD libasan into node with an instrumented
    # addon build. Valgrind on V8's JIT is impractically slow — this is the
    # memory-error gate.
    name: ubuntu · ASAN/UBSan
    runs-on: ubuntu-latest
    env:
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install (node_modules for tsc + @types; builds a default .node)
        run: npm install
      - name: Build the addon with sanitizers
        env:
          # node-gyp honors CC/CXX (with embedded flags) from the environment
          CC: 'gcc -fsanitize=address,undefined -fno-omit-frame-pointer -g'
          CXX: 'g++ -fsanitize=address,undefined -fno-omit-frame-pointer -g'
        run: npx node-gyp rebuild
      - run: npm run build
      - name: Run the suite under ASAN/UBSan
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: >
          LD_PRELOAD=$(gcc -print-file-name=libasan.so)
          node --test dist/test/*.test.js

  pack-and-install:
    # Prove the artifact a consumer gets from npm works (expr-eval-nextgen
    # pattern): pack the tarball, install it into a clean directory, and
    # smoke-test the public API against the installed files. The tarball has
    # no prebuilds on CI, so this exercises the node-gyp-build source
    # fallback (python + a toolchain, which ubuntu runners have).
    name: ubuntu · pack → clean install → smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --ignore-scripts && npm run build && npx node-gyp rebuild
      - run: npm pack
      - name: Clean install + smoke test
        run: |
          mkdir /tmp/smoke && cd /tmp/smoke
          npm init -y >/dev/null
          npm install "$OLDPWD"/shm-bridge-*.tgz --no-audit --no-fund
          node -e "
            const m = require('shm-bridge');
            const name = '/shm-bridge-smoke-' + process.pid;
            const sab = m.open(name, 4096);
            const v = new Int32Array(sab);
            v[3] = 42;
            if (new Int32Array(m.open(name, 4096))[3] !== 42) throw new Error('cross-open read broke');
            const mutex = m.Mutex.open(name + '-m');
            if (mutex.lock().ownerDied !== false) throw new Error('lock broke');
            mutex.unlock();
            mutex.close();
            m.unlink(name); m.unlink(name + '-m');
            console.log('installed-package smoke test passed');
          "
