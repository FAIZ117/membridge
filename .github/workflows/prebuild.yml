name: prebuilds

# Build the 18 per-ABI prebuilds (6 targets × Node 22/24/26) and assemble the
# publish artifact exactly per the package.json `files` whitelist. Invoked by
# release.yml on v* tags (workflow_call); workflow_dispatch for manual runs.

on:
  workflow_dispatch:
  workflow_call:  # release.yml reuses this on tag pushes (test matrix → prebuilds → publish)

jobs:
  prebuild:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        # dir = the node-gyp-build tuple (EXACTLY <platform>-<arch>); libctag
        # goes into the FILENAME (node-gyp-build matches glibc/musl by tag —
        # a libc-suffixed DIRECTORY would never match its parseTuple)
        include:
          - { target: linux-x64-glibc, os: ubuntu-latest, dir: linux-x64, libctag: glibc }
          # cross arm64: needs the aarch64 cross-toolchain (installed below)
          - { target: linux-arm64-glibc, os: ubuntu-latest, dir: linux-arm64, libctag: glibc, cross: arm64 }
          # alpine has no bash — the job's run steps use sh
          - { target: linux-x64-musl, os: ubuntu-latest, dir: linux-x64, libctag: musl, container: 'node:22-alpine', shell: sh }
          - { target: darwin-arm64, os: macos-latest, dir: darwin-arm64, libctag: '' }
          # darwin-x64: build x86_64 slices under Rosetta-less clang
          - { target: darwin-x64, os: macos-latest, dir: darwin-x64, libctag: '' }
          # windows-2022: node-gyp's VS discovery overflows its stdio buffer
          # on the windows-2025 image (same reason as ci.yml)
          - { target: win32-x64, os: windows-2022, dir: win32-x64, libctag: '' }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ matrix.shell || 'bash' }}
    container: ${{ matrix.container || null }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: ${{ matrix.container == null }}
        with:
          node-version: 24
      - name: Install toolchain (musl container)
        if: ${{ matrix.container != null }}
        run: apk add --no-cache python3 make g++ linux-headers
      - name: Install aarch64 cross-toolchain
        if: ${{ matrix.cross == 'arm64' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
      - name: Install (typescript only; no native build here)
        run: |
          npm install --ignore-scripts
          npm run build
      # prebuildify v6 only produces N-API layouts; this addon is plain-V8
      # (ABI-specific), so build each Node ABI explicitly with node-gyp
      # --target and lay the files out exactly as node-gyp-build resolves
      # them: prebuilds/<platform>-<arch>/shmbridge.abi<N>[.<libc>].node.
      # CC/CXX/ARCH are exported ONLY for the targets that need them — an
      # EMPTY CC/CXX env makes node-gyp emit a mangled compile line.
      - name: Build per-ABI prebuilds (Node 22/24/26)
        run: |
          set -e
          DIR="${{ matrix.dir }}"
          LIBCTAG="${{ matrix.libctag || '' }}"
          mkdir -p "prebuilds/$DIR"
          for VER in 22.0.0 24.0.0 26.0.0; do
            rm -rf build
            unset CC CXX ARCH_ARGS
            case "${{ matrix.target }}" in
              linux-arm64-glibc)
                export CC=aarch64-linux-gnu-gcc CXX=aarch64-linux-gnu-g++
                ARCH_ARGS=--arch=arm64 ;;
              darwin-x64)
                export CC="clang -arch x86_64" CXX="clang++ -arch x86_64"
                ARCH_ARGS=--arch=x86_64 ;;
            esac
            npx node-gyp rebuild --release --target=$VER --dist-url=https://nodejs.org/dist $ARCH_ARGS
            ABI=$(sed -n 's/.*"node_module_version": \([0-9]*\).*/\1/p' build/config.gypi | head -1)
            echo "node $VER -> ABI $ABI"
            test -n "$ABI"
            cp build/Release/shmbridge.node "prebuilds/$DIR/shmbridge.abi$ABI${LIBCTAG:+.$LIBCTAG}.node"
          done
          find "prebuilds/$DIR" -type f | sort
      - name: Stage prebuilds
        run: |
          mkdir -p stage/prebuilds
          cp -r prebuilds/* stage/prebuilds/
      - uses: actions/upload-artifact@v4
        with:
          name: prebuilds-${{ matrix.target }}
          path: stage/prebuilds/

  assemble:
    # Merge the per-target prebuilds into one publish tarball (§12 files
    # whitelist: dist/ esm/ prebuilds/ cc/ binding.gyp + npm auto-includes).
    name: assemble publish artifact
    needs: prebuild
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: prebuilds-*
          path: artifacts/
      - name: Merge prebuilds + build JS
        run: |
          # Each uploaded artifact holds the platform dirs at its root (upload
          # strips the stage/ prefix). Rebuild one prebuilds/ tree, keeping
          # each file's path after the artifact name.
          mkdir -p prebuilds
          while IFS= read -r f; do
            rel=${f#artifacts/*/}
            mkdir -p "prebuilds/$(dirname "$rel")"
            cp -n "$f" "prebuilds/$rel"
          done < <(find artifacts -name '*.node')
          find prebuilds -name '*.node' | sort
          npm install --ignore-scripts
          npm run build
      - name: Sanity — every target × ABI present (6 × 3 = 18 files, 5 dirs)
        run: |
          count=$(find prebuilds -name '*.node' | wc -l)
          dirs=$(find prebuilds -mindepth 1 -maxdepth 1 -type d | wc -l)
          echo "prebuilds: $count files in $dirs dirs"
          test "$count" -eq 18
          test "$dirs" -eq 5
          # the musl files must be tagged, and glibc files must not serve musl
          test "$(find prebuilds -name '*.musl.node' | wc -l)" -eq 3
          test "$(find prebuilds -name '*.glibc.node' | wc -l)" -eq 6
      - name: Pack
        run: npm pack --dry-run
      - name: Assemble the publish tarball
        run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: shm-bridge-publish
          path: shm-bridge-*.tgz
